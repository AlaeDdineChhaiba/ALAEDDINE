<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="hotel.css">
</head>
<body>
    <div class="All">
        <div class="hotel">
            <h1>HOTEl</h1>
        </div>
        <div class="card">
            <p>Visiteur</p>
            <input type="text" placeholder="Visiteur">
        </div>
        <div class="card">
            <p>Chombre</p>
            <input type="number" placeholder="Chombre">
        </div>
        <div class="card">
            <p>Type De Chambre</p>
            <select>
                <option value="">Standard</option>
                <option value="">Superieure</option>
                <option value="">Deluxe</option>
            </select>
        </div>
        <div class="card">
            <p>Lits</p>
            <input type="number" placeholder="Lits">
        </div>
        <div class="card">
            <p>Les Repas</p>
            <select>
                <option value="">Pension Complete</option>
                <option value="">Demi-pension</option>
                <option value="">Logment Seul</option>
            </select>
        </div>
    <div class="dates">
        <div class="card">
            <p>Date de debut</p>
            <input type="date">
        </div>
        <div class="card">
            <p>Date de fin</p>
            <input type="date">
        </div>
    </div>
        <div class="cardTotal">
            <p style="font-size: 20px;">Prix Total</p>
            <input type="number" placeholder="Prix Total" class="total">
        </div>
        <div class="button">
            <form action="" method="post" class="btn">
                <button type="submit">Add</button>
                <button type="submit">Delete</button>
                <button type="submit">Update</button>
                <button type="submit">Cancel</button>
            </form>
        </div>
    </div>
</body>
</html>
